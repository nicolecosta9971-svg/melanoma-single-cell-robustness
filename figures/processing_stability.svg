<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1110" viewBox="0 0 1800 1110" role="img" aria-labelledby="title description">
<title id="title">All five predeclared processing fits</title>
<desc id="description">Five same-cohort integration and annotation sensitivity fits, with stored median effects, bootstrap intervals, p-values and descriptive AUC. Setting ranges are not confidence intervals or independent replication.</desc>
<rect width="1800" height="1110" fill="#ffffff"/>
<text x="40" y="49" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#183141" font-weight="bold" text-anchor="start">All five processing fits: stable group direction, not stable individual measurement</text>
<text x="40" y="85" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#405868" font-weight="normal" text-anchor="start">Sensitivity; Pozniak baseline patients; each fit has 10 R / 12 NR. No preferred seed selected.</text>
<text x="40" y="119" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405868" font-weight="normal" text-anchor="start">Median R-minus-NR balance differences; stored 95% patient-bootstrap intervals (5,000 resamples, bootstrap seed 22).</text>
