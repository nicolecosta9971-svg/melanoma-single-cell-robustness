<text x="40" y="805" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183141" font-weight="bold" text-anchor="start">Descriptive ranges: median difference 4.3018–4.5677; AUC 0.8167–0.8500; p 0.006211–0.0134105.</text>
<text x="40" y="849" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#405868" font-weight="normal" text-anchor="start">All ten seed-pair majority-label agreements on 24,361 baseline/on-treatment cells: 0.860515–0.957555. Largest absolute patient-score shift versus the controlled vector: 3.4576</text>
<text x="40" y="877" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#405868" font-weight="normal" text-anchor="start">log2 units (not a maximum pairwise-seed difference).</text>
<text x="40" y="927" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405868" font-weight="normal" text-anchor="start">These dependent fits do not add independent patients, erase outcome-informed selection or establish a clinical threshold. Directional stability is not exact historical</text>
<text x="40" y="954" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405868" font-weight="normal" text-anchor="start">reproduction or annotation accuracy. Intervals condition on each fitted annotation. See docs/FIGURE_CAPTIONS.md. Aggregate reuse review pending.</text>
