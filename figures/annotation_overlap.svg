<circle cx="1140.43" cy="842" r="6" fill="#245b78"/>
<text x="1310" y="848" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183141" font-weight="normal" text-anchor="start">80.71% [76.70, 84.51]</text>
<text x="40" y="915" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183141" font-weight="normal" text-anchor="start">A08  Fixed capture within author: I / A</text>
