<text x="950" y="1041" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#405868" font-weight="normal" text-anchor="middle">Patient-balanced overlap (%) with pointwise 95% interval</text>
<text x="40" y="1078" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#405868" font-weight="normal" text-anchor="start">A = author-label set; B = fixed CellTypist set; I = intersection. Ratios use sample joint fractions averaged within patient, then equal patient weights. They are not pooled-cell</text>
<text x="40" y="1106" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#405868" font-weight="normal" text-anchor="start">overlap or the mean of patient-level ratios. Directional captures are deliberately asymmetric.</text>
<text x="40" y="1171" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405868" font-weight="normal" text-anchor="start">Whole-patient percentile bootstrap: 5,000 resamples, seed 20261016; not response-stratified; pointwise, not simultaneous intervals. All nine estimates retained; zero undefined</text>
<text x="40" y="1198" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405868" font-weight="normal" text-anchor="start">draws. Cycling/doublet-labelled records remain in denominators. Neither taxonomy is truth; no biological accuracy, suppressive-function or independent-validation claim.</text>
<text x="40" y="1225" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405868" font-weight="normal" text-anchor="start">Aggregate reuse review pending.</text>
</svg>
