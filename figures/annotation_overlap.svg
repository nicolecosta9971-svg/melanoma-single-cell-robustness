<text x="1310" y="781" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183141" font-weight="normal" text-anchor="start">74.05% [68.96, 77.32]</text>
<text x="40" y="848" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183141" font-weight="normal" text-anchor="start">A07  Author capture within fixed: I / B</text>
