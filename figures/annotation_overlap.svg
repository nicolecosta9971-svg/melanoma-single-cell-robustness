<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1330" viewBox="0 0 1800 1330" role="img" aria-labelledby="title description">
<title id="title">All nine patient-balanced author-annotation overlaps</title>
<desc id="description">Three non-equivalent author and fixed-label comparisons with Jaccard and both directional capture estimates. Nine stored pointwise patient-bootstrap intervals. Overlap is measurement agreement, not accuracy or external validation.</desc>
<rect width="1800" height="1330" fill="#ffffff"/>
<text x="40" y="49" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#183141" font-weight="bold" text-anchor="start">Annotation definitions differ: all nine overlap estimates</text>
<text x="40" y="85" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#405868" font-weight="normal" text-anchor="start">Same-data measurement sensitivity; Pozniak: 22 patients, 23 baseline records, 14,801 cells. No hypothesis/response test; p not applicable.</text>
