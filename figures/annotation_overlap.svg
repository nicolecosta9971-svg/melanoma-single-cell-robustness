<text x="40" y="145" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#183141" font-weight="bold" text-anchor="start">Narrow author cytotoxic CD8 versus fixed Tem/Trm (not equivalent definitions)</text>
<text x="40" y="209" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#183141" font-weight="normal" text-anchor="start">A00  Jaccard: intersection / union</text>
