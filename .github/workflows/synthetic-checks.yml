name: Synthetic code and portfolio file checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-file-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out curated portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic, file and passive SVG tests
        run: python -I -S -B -m unittest discover -s tests -v
      - name: Invented-data demonstration
        run: python -I -S -B scripts/run_synthetic_demo.py
      - name: Exact portfolio contents and bounded SVG checks
        run: python -I -S -B scripts/check_release.py
